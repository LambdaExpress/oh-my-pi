<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>omp shell</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #fcfcfb;
				--bg-raised: #fdfdfc;
				--bg-subtle: #f5f6f4;
				--bg-hover: #eaebe9;
				--fg: #202321;
				--fg-muted: #565c58;
				--fg-faint: #686e6a;
				--accent: #0b74b1;
				--accent-hover: #095f94;
				--accent-fg: #f7fbfd;
				--border: #dee1de;
				--border-strong: #c9ceca;
				--ring: rgb(11 116 177 / 38%);
				--err: #b84242;
				--err-muted: #f9eded;
				--window-close-hover: #c42b1c;
				--radius-sm: 6px;
				--radius: 10px;
				--radius-lg: 14px;
				--shadow-pop: 0 14px 36px rgb(25 33 29 / 12%), 0 2px 8px rgb(25 33 29 / 7%);
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #181a19;
					--bg-raised: #222523;
					--bg-subtle: #262a27;
					--bg-hover: #303531;
					--fg: #eef1ee;
					--fg-muted: #b6bcb7;
					--fg-faint: #929a94;
					--accent: #56a9d5;
					--accent-hover: #71b9de;
					--accent-fg: #102a37;
					--border: #343936;
					--border-strong: #49504b;
					--ring: rgb(86 169 213 / 48%);
					--err: #df7777;
					--err-muted: #382323;
					--shadow-pop: 0 14px 36px rgb(0 0 0 / 38%), 0 2px 8px rgb(0 0 0 / 32%);
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				height: 100vh;
				display: grid;
				grid-template-rows: 36px minmax(0, 1fr);
				overflow: hidden;
				background: var(--bg);
				color: var(--fg);
				font: 400 14px/22px ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			.titlebar {
				display: flex;
				align-items: stretch;
				justify-content: space-between;
				background: var(--bg-subtle);
				border-bottom: 1px solid var(--border);
				user-select: none;
			}
			.drag-region {
				display: flex;
				align-items: center;
				gap: 8px;
				min-width: 0;
				flex: 1;
				padding: 0 12px;
			}
			.app-mark {
				width: 14px;
				height: 14px;
				border-radius: 4px;
				background: linear-gradient(135deg, var(--accent), var(--accent-hover));
				pointer-events: none;
			}
			.window-title {
				overflow: hidden;
				font-size: 12px;
				font-weight: 550;
				text-overflow: ellipsis;
				white-space: nowrap;
				pointer-events: none;
			}
			.window-controls {
				display: flex;
			}
			.window-button {
				width: 46px;
				height: 35px;
				padding: 0;
				color: var(--fg-muted);
				background: transparent;
				border: 0;
				border-radius: 0;
				font: 400 16px/1 "Segoe UI Symbol", sans-serif;
				transition: color 100ms ease-out, background 100ms ease-out;
			}
			.window-button:hover {
				color: var(--fg);
				background: var(--bg-hover);
			}
			.window-close:hover {
				color: white;
				background: var(--window-close-hover);
			}
			.content {
				min-width: 0;
				min-height: 0;
				display: grid;
				place-items: center;
				overflow-y: auto;
				padding: 24px;
			}
			.card {
				width: min(480px, calc(100vw - 48px));
				padding: 32px;
				background: var(--bg-raised);
				border: 1px solid var(--border);
				border-radius: var(--radius-lg);
				box-shadow: var(--shadow-pop);
			}
			h1 {
				margin: 0 0 8px;
				font-size: 24px;
				line-height: 32px;
				font-weight: 600;
			}
			h1 .pi {
				color: var(--accent);
			}
			.sub {
				margin: 0 0 24px;
				font-size: 14px;
				color: var(--fg-muted);
			}
			.section-label {
				display: block;
				margin-bottom: 8px;
				font: 500 12px/16px ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
				color: var(--fg-faint);
			}
			#recent {
				list-style: none;
				margin: 0 0 16px;
				padding: 0;
				display: flex;
				flex-direction: column;
				gap: 6px;
			}
			#recent .empty {
				padding: 12px;
				font-size: 13px;
				color: var(--fg-faint);
				border: 1px dashed var(--border);
				border-radius: var(--radius);
			}
			.recent-item {
				display: flex;
				flex-direction: column;
				gap: 2px;
				width: 100%;
				padding: 12px;
				text-align: left;
				color: var(--fg);
				background: var(--bg-subtle);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				cursor: pointer;
				transition: border-color 140ms ease-out, background 140ms ease-out;
			}
			.recent-item:hover {
				border-color: var(--border-strong);
				background: var(--bg-hover);
			}
			.recent-item[aria-current="true"] {
				border-color: var(--border-strong);
				background: var(--bg-hover);
			}
			.recent-item:focus-visible,
			button.open:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
				box-shadow: 0 0 0 4px var(--ring);
			}
			.recent-item .name {
				font-size: 13px;
				font-weight: 600;
			}
			.recent-item .name-row {
				display: flex;
				gap: 8px;
				align-items: center;
			}
			.recent-item .current-label {
				padding: 1px 6px;
				font-size: 10px;
				font-weight: 500;
				line-height: 16px;
				color: var(--fg-muted);
				background: var(--bg-raised);
				border: 1px solid var(--border);
				border-radius: var(--radius-sm);
			}
			.recent-item .path {
				font: 400 11px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
				color: var(--fg-faint);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.actions {
				display: flex;
				gap: 10px;
				align-items: center;
				margin-bottom: 18px;
			}
			button.open {
				min-height: 36px;
				padding: 8px 16px;
				font-size: 13px;
				font-weight: 500;
				color: var(--accent-fg);
				background: var(--accent);
				border: none;
				border-radius: var(--radius);
				cursor: pointer;
				transition: background 140ms ease-out;
			}
			button.open:hover {
				background: var(--accent-hover);
			}
			#err {
				margin: 0 0 12px;
				padding: 8px 12px;
				font-size: 12px;
				color: var(--err);
				background: var(--err-muted);
				border: 1px solid var(--err);
				border-radius: var(--radius);
				word-break: break-all;
			}
			#err[hidden] {
				display: none;
			}
			.foot {
				margin: 0;
				font: 400 11px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
				color: var(--fg-faint);
			}
			@media (max-width: 640px) {
				.content {
					place-items: start center;
					padding: 24px 0;
				}
				.card {
					width: calc(100vw - 24px);
					padding: 24px;
				}
				.recent-item,
				button.open {
					min-height: 44px;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					transition-duration: 0.01ms !important;
				}
			}
		</style>
	</head>
	<body>
		<header class="titlebar" data-tauri-drag-region>
			<div class="drag-region" id="drag-region" data-tauri-drag-region>
				<span class="app-mark" aria-hidden="true"></span>
				<span class="window-title">omp shell</span>
			</div>
			<div class="window-controls">
				<button type="button" class="window-button" id="minimize" aria-label="最小化窗口" title="最小化">−</button>
				<button type="button" class="window-button" id="maximize" aria-label="最大化窗口" title="最大化">□</button>
				<button type="button" class="window-button window-close" id="close" aria-label="关闭窗口" title="关闭到托盘">×</button>
			</div>
		</header>
		<main class="content">
			<div class="card">
				<h1><span class="pi">omp</span> shell</h1>
				<p class="sub">打开一个项目目录，启动 omp 核心引擎。</p>
				<span class="section-label">最近项目</span>
				<ul id="recent"></ul>
				<div class="actions">
					<button type="button" class="open" id="open">打开其他项目…</button>
				</div>
				<p id="err" role="alert" aria-live="assertive" hidden></p>
				<p class="foot" id="version"></p>
			</div>
		</main>
		<script>
			const invoke = window.__TAURI_INTERNALS__.invoke;
			const err = document.getElementById("err");
			const maximize = document.getElementById("maximize");

			async function toggleMaximize() {
				const maximized = await invoke("window_toggle_maximize");
				maximize.textContent = maximized ? "❐" : "□";
				maximize.setAttribute("aria-label", maximized ? "还原窗口" : "最大化窗口");
				maximize.title = maximized ? "还原" : "最大化";
			}

			document.getElementById("minimize").addEventListener("click", () => invoke("window_minimize"));
			maximize.addEventListener("click", () => toggleMaximize().catch(fail));
			document.getElementById("close").addEventListener("click", () => invoke("window_close"));
			document.getElementById("drag-region").addEventListener("mousedown", event => {
				if (event.button === 0 && event.detail === 1) invoke("window_start_dragging").catch(fail);
			});
			document.getElementById("drag-region").addEventListener("dblclick", () => toggleMaximize().catch(fail));

			function fail(error) {
				err.textContent = String(error);
				err.hidden = false;
			}

			function openProject(path) {
				err.hidden = true;
				invoke("project_switch", { path }).catch(fail);
			}

			document.getElementById("open").addEventListener("click", () => {
				err.hidden = true;
				invoke("project_open").catch(fail);
			});
			document.addEventListener("keydown", event => {
				if (!(event.ctrlKey || event.metaKey) || event.altKey || event.key.toLowerCase() !== "o") return;
				event.preventDefault();
				err.hidden = true;
				invoke("project_open").catch(fail);
			});

			(async () => {
				try {
					if (await invoke("window_is_maximized")) {
						maximize.textContent = "❐";
						maximize.setAttribute("aria-label", "还原窗口");
						maximize.title = "还原";
					}
					const info = await invoke("app_info");
					document.getElementById("version").textContent = `${info.product_name} v${info.version}`;
					const list = await invoke("project_list");
					const ul = document.getElementById("recent");
					const items = list.recent_projects ?? [];
					if (items.length === 0) {
						const li = document.createElement("li");
						li.className = "empty";
						li.textContent = "暂无最近项目";
						ul.appendChild(li);
						return;
					}
					for (const path of items) {
						const current = path === list.current_project;
						const li = document.createElement("li");
						const btn = document.createElement("button");
						btn.type = "button";
						btn.className = "recent-item";
						if (current) {
							btn.setAttribute("aria-current", "true");
						}
						const nameRow = document.createElement("span");
						nameRow.className = "name-row";
						const name = document.createElement("span");
						name.className = "name";
						name.textContent = path.split(/[\\/]/).filter(Boolean).pop() || path;
						nameRow.appendChild(name);
						if (current) {
							const currentLabel = document.createElement("span");
							currentLabel.className = "current-label";
							currentLabel.textContent = "当前";
							nameRow.appendChild(currentLabel);
						}
						const pathSpan = document.createElement("span");
						pathSpan.className = "path";
						pathSpan.textContent = path;
						btn.append(nameRow, pathSpan);
						btn.addEventListener("click", () => openProject(path));
						li.appendChild(btn);
						ul.appendChild(li);
					}
				} catch (error) {
					fail(error);
				}
			})();
		</script>
	</body>
</html>
