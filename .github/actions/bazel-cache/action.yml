name: "Compose bazel cache config"
description: >
   Emits a bazelrc fragment using the cluster remote cache when credentials
   are available. Hosted release jobs with an explicit scope restore a disk
   cache; inputless callers without credentials build uncached.

   Scoped v3 keys cover toolchain/build config and source separately. The
   action-only profile excludes downloaded repositories/toolchains from the
   archive and uses a distinct key. Restores fall back to the config prefix,
   then scope+os+arch, then an optional sibling scope on the same runner image.
   Bazel's content-addressed action keys safely reject stale entries. Only
   main saves refreshed archives; tag/branch archives would consume the shared
   quota without seeding other refs. Disk entries untouched for 14 days are
   pruned, but repository-cache contents retain upstream archive mtimes and
   must never be pruned file-by-file.

inputs:
   scope:
      description: Optional disk-cache discriminator for compatible hosted consumers; empty disables the hosted cache
      required: false
      default: ""
   persist-repository-cache:
      description: Include downloaded repositories and toolchains in the GitHub cache archive
      required: false
      default: "true"
   fallback-scope:
      description: Optional scope whose newest archive seeds this one on the same runner image
      required: false
      default: ""

outputs:
   rc:
      description: Path to the generated bazelrc fragment
      value: ${{ steps.compose.outputs.rc }}
   cache-key:
      description: Exact GitHub cache key for a later explicit save
      value: ${{ steps.backend.outputs.cache-key }}
   cache-paths:
      description: Newline-separated paths that restore and save must share
      value: ${{ steps.backend.outputs.cache-paths }}
   save-needed:
      description: Whether a scoped hosted run on main needs to save a new exact-key archive
      value: ${{ steps.compose.outputs.save-needed }}
   remote:
      description: Whether the shell probe selected the cluster remote cache
      value: ${{ steps.backend.outputs.remote }}

runs:
   using: composite
   steps:
      - name: Detect bazel cache backend
        id: backend
        shell: bash
        env:
           CONFIG_HASH: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**') }}
           SOURCE_HASH: ${{ hashFiles('crates/**', 'BUILD.bazel') }}
           CACHE_SCOPE: ${{ inputs.scope }}
           FALLBACK_SCOPE: ${{ inputs.fallback-scope }}
           PERSIST_REPOSITORY_CACHE: ${{ inputs.persist-repository-cache }}
        run: |
           set -euo pipefail
           remote=false
           case "$PERSIST_REPOSITORY_CACHE" in
             true) profile="" ;;
             false) profile="-action-only" ;;
             *)
               echo "::error::persist-repository-cache must be true or false"
               exit 1
               ;;
           esac
           if [ -n "${BAZEL_REMOTE_USER:-}" ] || [ -n "${BAZEL_REMOTE_PASSWORD:-}" ]; then
             if [ -z "${BAZEL_REMOTE_USER:-}" ] || [ -z "${BAZEL_REMOTE_PASSWORD:-}" ]; then
               echo "::error::BAZEL_REMOTE_USER and BAZEL_REMOTE_PASSWORD must both be set"
               exit 1
             fi
             remote=true
           elif [ -z "$CACHE_SCOPE" ]; then
             echo "::notice title=Bazel cache::No cluster remote-cache credentials on this runner; building uncached."
           fi
           key="bazel-disk-v3${profile}-${CACHE_SCOPE}-${{ runner.os }}-${{ runner.arch }}-$CONFIG_HASH-$SOURCE_HASH"
           prefix="bazel-disk-v3${profile}-${CACHE_SCOPE}-${{ runner.os }}-${{ runner.arch }}-$CONFIG_HASH-"
           bare_prefix="bazel-disk-v3${profile}-${CACHE_SCOPE}-${{ runner.os }}-${{ runner.arch }}-"
           fallback_prefix=""
           if [ -n "$FALLBACK_SCOPE" ]; then
             fallback_prefix="bazel-disk-v3${profile}-${FALLBACK_SCOPE}-${{ runner.os }}-${{ runner.arch }}-"
           fi
           {
             echo "remote=$remote"
             echo "cache-key=$key"
             echo "cache-prefix=$prefix"
             echo "cache-bare-prefix=$bare_prefix"
             echo "cache-fallback-prefix=$fallback_prefix"
             echo "cache-paths<<EOF"
             echo "$HOME/.cache/omp-bazel-disk"
             if [ "$PERSIST_REPOSITORY_CACHE" = true ]; then
               echo "$HOME/.cache/omp-bazel-repo"
             fi
             echo "EOF"
           } >> "$GITHUB_OUTPUT"

      - name: Restore bazel disk cache
        id: restore
        if: steps.backend.outputs.remote != 'true' && inputs.scope != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
           # Restore and save consume the same profile-specific path list.
           path: ${{ steps.backend.outputs.cache-paths }}
           key: ${{ steps.backend.outputs.cache-key }}
           restore-keys: |
              ${{ steps.backend.outputs.cache-prefix }}
              ${{ steps.backend.outputs.cache-bare-prefix }}
              ${{ steps.backend.outputs.cache-fallback-prefix }}

      - name: Compose cache config
        id: compose
        shell: bash
        env:
           REMOTE: ${{ steps.backend.outputs.remote }}
           CACHE_SCOPE: ${{ inputs.scope }}
           RESTORE_HIT: ${{ steps.restore.outputs.cache-hit }}
           ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
           set -euo pipefail
           save_needed=false
           if [ "$REMOTE" != "true" ] && [ -n "$CACHE_SCOPE" ] && [ "$RESTORE_HIT" != "true" ] && [ "$ON_MAIN" = "true" ]; then
             save_needed=true
           fi

           rc="$RUNNER_TEMP/bazel-cache.rc"
           if [ "$REMOTE" = "true" ]; then
             # Mask credentials before --announce_rc can print remote_header.
             raw_auth="${BAZEL_REMOTE_USER}:${BAZEL_REMOTE_PASSWORD}"
             auth="$(printf %s "$raw_auth" | base64 | tr -d '\n')"
             echo "::add-mask::$raw_auth"
             echo "::add-mask::$auth"
             {
               # The PVC lives outside HOME; pods use a per-job output root.
               echo "startup --output_user_root=$RUNNER_TEMP/bazel-root"
               echo "common --config=ci"
               echo "common --repository_cache=/opt/bazel-repo-cache"
               echo "common --repo_env=OMP_XWIN_CACHE_DIR=/opt/bazel-repo-cache/xwin"
               echo "common --config=cache-rw"
               echo "common --remote_cache=grpcs://bazel-remote.bazel-cache.svc.cluster.local:9092"
               echo "common --tls_certificate=infra/bazel-remote/ca.crt"
               echo "common --remote_header='authorization=Basic ${auth}'"
               echo "common --remote_download_toplevel"
             } > "$rc"
           elif [ -n "$CACHE_SCOPE" ]; then
             mkdir -p "$HOME/.cache/omp-bazel-disk" "$HOME/.cache/omp-bazel-repo"
             # Repository contents keep archive mtimes; prune only disk actions.
             find "$HOME/.cache/omp-bazel-disk" -type f -mtime +14 -delete 2>/dev/null || true
             {
               echo "common --config=ci"
               echo "common --disk_cache=$HOME/.cache/omp-bazel-disk"
               echo "common --repository_cache=$HOME/.cache/omp-bazel-repo"
             } > "$rc"
           else
             echo "common --config=ci" > "$rc"
           fi
           {
             echo "rc=$rc"
             echo "save-needed=$save_needed"
           } >> "$GITHUB_OUTPUT"
