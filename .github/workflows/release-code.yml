name: Release Code

on:
   push:
      branches: [release]

permissions:
   contents: read

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
   tag:
      name: Tag release code
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      outputs:
         code: ${{ steps.meta.outputs.code }}
         tag: ${{ steps.meta.outputs.tag }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              fetch-depth: 0
         - name: Create monotonic code tag
           id: meta
           shell: bash
           env:
              RELEASE_CODE: ${{ github.run_number }}
           run: |
              set -euo pipefail
              tag="code-${RELEASE_CODE}"
              existing="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" 2>/dev/null || true)"
              if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
                echo "${tag} already points to ${existing}, not ${GITHUB_SHA}" >&2
                exit 1
              fi
              if [ -z "$existing" ]; then
                git -c user.name="github-actions[bot]" \
                    -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                    tag -a "$tag" "$GITHUB_SHA" -m "Release code ${RELEASE_CODE}"
                git push origin "refs/tags/${tag}"
              fi
              {
                echo "code=${RELEASE_CODE}"
                echo "tag=${tag}"
              } >> "$GITHUB_OUTPUT"

   # Linux release targets share most Bazel action outputs and the entire
   # repository/toolchain cache with targets built on the same host image.
   # Populate one cache per host OS/architecture, then fan binary compilation
   # back out through artifacts. Serial target builds avoid concurrent rustc
   # links exhausting hosted-runner memory while preserving one complete cache
   # archive instead of one mostly-duplicate archive per shipping target.
   build_linux_natives:
      name: Build Linux-hosted native addons (${{ matrix.host_group }})
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: ubuntu-22.04
                 host_group: linux-x64
                 cache_scope: code-linux-host-x64
                 native_targets: linux-x64-baseline linux-x64-modern linux-musl-x64-baseline win32-x64-baseline
               - os: ubuntu-24.04-arm
                 host_group: linux-arm64
                 cache_scope: code-linux-host-arm64
                 native_targets: linux-arm64 linux-musl-arm64
      runs-on: ${{ matrix.os }}
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
         - uses: ./.github/actions/setup-system-deps
         - id: cache
           uses: ./.github/actions/bazel-cache
           with:
              scope: ${{ matrix.cache_scope }}
         - name: Build native addon targets
           shell: bash
           env:
              NATIVE_TARGETS: ${{ matrix.native_targets }}
              OMP_BAZEL_RC: ${{ steps.cache.outputs.rc }}
           run: |
              set -euo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              read -r -a targets <<< "$NATIVE_TARGETS"
              for target in "${targets[@]}"; do
                bun scripts/bazel-natives.ts "$target" --dest "$RUNNER_TEMP/native-build/$target"
              done
         - name: Save combined Bazel disk cache
           if: steps.cache.outputs.save-needed == 'true'
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: |
                 ~/.cache/omp-bazel-disk
                 ~/.cache/omp-bazel-repo
              key: ${{ steps.cache.outputs.cache-key }}
         - name: Upload native addon artifacts
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: native-addons-${{ matrix.host_group }}
              path: bazel-bin/natives-*/*.node
              if-no-files-found: error
              retention-days: 1

   build_linux:
      name: Build ${{ matrix.target_id }}
      needs: [tag, build_linux_natives]
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: ubuntu-22.04
                 target_id: linux-x64
                 binary_path: packages/coding-agent/binaries/omp-linux-x64
                 native_targets: linux-x64-baseline linux-x64-modern
                 smoke: linux
                 native_artifact: native-addons-linux-x64
               - os: ubuntu-22.04
                 target_id: linux-musl-x64
                 binary_path: packages/coding-agent/binaries/omp-linux-musl-x64
                 native_targets: linux-musl-x64-baseline
                 smoke: musl
                 native_artifact: native-addons-linux-x64
               - os: ubuntu-24.04-arm
                 target_id: linux-arm64
                 binary_path: packages/coding-agent/binaries/omp-linux-arm64
                 native_targets: linux-arm64
                 smoke: linux
                 native_artifact: native-addons-linux-arm64
               - os: ubuntu-24.04-arm
                 target_id: linux-musl-arm64
                 binary_path: packages/coding-agent/binaries/omp-linux-musl-arm64
                 native_targets: linux-musl-arm64
                 smoke: musl
                 native_artifact: native-addons-linux-arm64
               - os: ubuntu-22.04
                 target_id: win32-x64
                 binary_path: packages/coding-agent/binaries/omp-windows-x64.exe
                 native_targets: win32-x64-baseline
                 smoke: cross
                 native_artifact: native-addons-linux-x64
      runs-on: ${{ matrix.os }}
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
         - uses: ./.github/actions/setup-system-deps
         - name: Install dependencies
           run: bun install --frozen-lockfile
         - name: Install prebuilt native addons
           uses: ./.github/actions/native-artifacts
           with:
              artifact-name: ${{ matrix.native_artifact }}
              targets: ${{ matrix.native_targets }}
         - name: Build release binary
           env:
              OMP_RELEASE_CODE: ${{ needs.tag.outputs.code }}
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         - name: Smoke Linux binary
           if: matrix.smoke == 'linux'
           shell: bash
           env:
              EXPECTED_CODE: ${{ needs.tag.outputs.code }}
           run: |
              set -euo pipefail
              runtime_dir="$(mktemp -d)"
              version="$(HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version)"
              case "$version" in
                *"+code.${EXPECTED_CODE}") ;;
                *) echo "unexpected version: $version" >&2; exit 1 ;;
              esac
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --smoke-test
         - name: Smoke musl binary on Alpine
           if: matrix.smoke == 'musl'
           shell: bash
           env:
              EXPECTED_CODE: ${{ needs.tag.outputs.code }}
           run: |
              set -euo pipefail
              binary="$(realpath "${{ matrix.binary_path }}")"
              docker run --rm -e EXPECTED_CODE -v "$binary:/usr/local/bin/omp:ro" alpine:3.22 sh -ec '
                apk add --no-cache libstdc++ libgcc >/dev/null
                version="$(omp --version)"
                case "$version" in
                  *"+code.${EXPECTED_CODE}") ;;
                  *) echo "unexpected version: $version" >&2; exit 1 ;;
                esac
                runtime_dir="$(mktemp -d)"
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --smoke-test
              '
         - name: Upload binary
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-code-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}
              if-no-files-found: error
              retention-days: 1

   # Darwin remains independent of the Linux cache producer so its 40-50 minute
   # cold path starts as soon as the release code is tagged.
   build_darwin:
      name: Build ${{ matrix.target_id }}
      needs: [tag]
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: macos-15-intel
                 target_id: darwin-x64
                 binary_path: packages/coding-agent/binaries/omp-darwin-x64
                 native_targets: darwin-x64-baseline
                 smoke: darwin
                 cache_scope: release-darwin-x64
               - os: macos-14
                 target_id: darwin-arm64
                 binary_path: packages/coding-agent/binaries/omp-darwin-arm64
                 native_targets: darwin-arm64
                 smoke: darwin
                 cache_scope: release-darwin-arm64
      runs-on: ${{ matrix.os }}
      permissions:
         contents: read
      env:
         MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
         - name: Cache Bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - name: Install dependencies
           run: bun install --frozen-lockfile
         - name: Build native addons
           uses: ./.github/actions/bazel-natives
           with:
              targets: ${{ matrix.native_targets }}
              cache-scope: ${{ matrix.cache_scope }}
         - name: Build release binary
           env:
              OMP_RELEASE_CODE: ${{ needs.tag.outputs.code }}
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         - name: Sign and notarize macOS binary
           if: env.MACOS_SIGNING == 'true'
           env:
              APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
              APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
              APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
              APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
              APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
           run: bash scripts/ci-macos-sign.sh "${{ matrix.binary_path }}"
         - name: Smoke macOS binary
           shell: bash
           env:
              EXPECTED_CODE: ${{ needs.tag.outputs.code }}
           run: |
              set -euo pipefail
              codesign --verify --strict --verbose=2 "${{ matrix.binary_path }}"
              runtime_dir="$(mktemp -d)"
              version="$(HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version)"
              case "$version" in
                *"+code.${EXPECTED_CODE}") ;;
                *) echo "unexpected version: $version" >&2; exit 1 ;;
              esac
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --smoke-test
         - name: Upload binary
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-code-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}
              if-no-files-found: error
              retention-days: 1

   publish:
      name: Publish code release
      needs: [tag, build_linux, build_darwin]
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
         - name: Download binaries
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: omp-code-*
              path: packages/coding-agent/binaries
              merge-multiple: true
         - name: Generate release metadata
           id: release
           shell: bash
           run: |
              set -euo pipefail
              version="$(bun -e 'const manifest = await Bun.file("packages/coding-agent/package.json").json(); console.log(manifest.version)')"
              echo "version=${version}" >> "$GITHUB_OUTPUT"
              bun run ci:release:checksums --markdown release-notes.md \
                packages/coding-agent/binaries/omp-* \
                LICENSE \
                THIRD-PARTY-NOTICES.txt
         - name: Create GitHub Release
           uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
           with:
              tag_name: ${{ needs.tag.outputs.tag }}
              name: OMP v${{ steps.release.outputs.version }} Build ${{ needs.tag.outputs.code }}
              body_path: release-notes.md
              generate_release_notes: true
              make_latest: true
              fail_on_unmatched_files: true
              files: |
                 packages/coding-agent/binaries/omp-*
                 LICENSE
                 THIRD-PARTY-NOTICES.txt
